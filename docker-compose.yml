services:
  config-server-e-learning-platform:
    image: "config-server-e-learning-platform"
    container_name: "config-server-e-learning-platform"
    environment:
      - THC_PATH=/actuator/health
      - THC_PORT=9095
    ports:
      - "9095:9095"
    healthcheck:
      test: [ "CMD", "/cnb/process/health-check" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  feedback-service:
    image: "feedback-service"
    container_name: "feedback-service"
    depends_on:
      postgres-feedbacks:
        condition: service_healthy
      config-server-e-learning-platform:
        condition: service_healthy
    ports:
      - "9093:9093"
    environment:
      - CONFIGSERVER_IMPORT=configserver:${CONFIG_SERVER_URL}
      - SPRING_CLOUD_CONFIG_FAIL_FAST=true
      - SPRING_PROFILES_ACTIVE=prod
      - DB_USER=${FEEDBACK_DB_USER}
      - DB_PASSWORD=${FEEDBACK_DB_PASSWORD}
      - DB_URL=${FEEDBACK_DB_URL}

  postgres-feedbacks:
    image: "postgres:16.1"
    container_name: "postgres-feedbacks"
    ports:
      - "5433:5433"
    environment:
      - POSTGRES_USER=${FEEDBACK_DB_USER}
      - POSTGRES_PASSWORD=${FEEDBACK_DB_PASSWORD}
      - POSTGRES_DB=feedback_service_db
      - PGPORT=5433
    volumes:
      - db-feedbacks:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-d", "feedback_service_db" ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s

volumes:
  db-feedbacks:
    driver: local